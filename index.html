<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小游戏中心</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1b2430 0%, #121821 55%, #0b1018 100%);
      color: #e8eef8;
      padding: 24px;
    }
    .wrap {
      width: min(1200px, 100%);
      margin: 0 auto;
      background: rgba(18, 27, 41, 0.72);
      border: 1px solid rgba(125, 164, 220, 0.26);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .head {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(125, 164, 220, 0.2);
      background: linear-gradient(90deg, rgba(41, 58, 90, 0.75), rgba(30, 44, 72, 0.8));
    }
    h1 { margin: 0; font-size: 24px; }
    .panel {
      padding: 18px;
      display: grid;
      gap: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 12px;
      border: 1px solid rgba(138, 178, 239, 0.28);
      background: rgba(26, 38, 58, 0.78);
      padding: 14px;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(172, 205, 255, 0.58);
    }
    .name { margin: 0; font-size: 17px; font-weight: 700; }
    .desc { margin: 8px 0 0; color: #a8bddf; font-size: 13px; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>小游戏中心</h1>
    </header>

    <section class="panel">
      <div class="grid">
        <a class="card" href="./games/shop-simulator/index.html">
          <p class="name">商店模拟器 (Shop Simulator)</p>
          <p class="desc">经营一家超市，雇佣员工，升级货架并处理大批顾客排队购买100种不同的商品。</p>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
