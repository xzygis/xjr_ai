<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辐射避难所 - 地下生存</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- 顶部资源栏 -->
        <header id="top-bar">
            <div class="resource" title="避难所人口">
                <span class="icon">👥</span>
                <span id="res-population">100</span> / <span id="max-population">100</span>
            </div>
            <div class="resource" title="食物 - 供幸存者进食">
                <span class="icon">🍱</span>
                <span id="res-food">500</span>
            </div>
            <div class="resource" title="净水 - 供幸存者洗澡饮用">
                <span class="icon">💧</span>
                <span id="res-water">500</span>
            </div>
            <div class="resource" title="士气 - 影响生产力">
                <span class="icon">😊</span>
                <span id="res-morale">100%</span>
            </div>
            <div class="resource" title="当前天数">
                <span class="icon">📅</span>
                第 <span id="game-day">1</span> 天
            </div>
            <button id="btn-back" onclick="location.href='../../index.html'">返回大厅</button>
        </header>

        <!-- 游戏主要视图 -->
        <main id="base-view">
            <!-- 地面区域 -->
            <div id="surface">
                <div class="wasteland">
                    <h2>☢️ 致命辐射区 ☢️</h2>
                    <p>外部环境极端恶劣，无法生存</p>
                </div>
            </div>

            <!-- 地下区域 -->
            <div id="underground">
                <div class="dirt-bg"></div>
                
                <div class="base-structure">
                    <!-- 左侧电梯井 -->
                    <div class="elevator-shaft">
                        <div class="elevator-car"></div>
                    </div>

                    <!-- 右侧房间列表 -->
                    <div class="rooms-container">
                        
                        <!-- 餐厅 -->
                        <div class="room canteen" id="room-canteen">
                            <div class="room-header">
                                <h3>🍱 餐厅 (生产食物)</h3>
                                <div class="room-stats">
                                    工人: <span class="worker-count">0</span> / 20
                                </div>
                            </div>
                            <div class="room-actions">
                                <button class="btn-assign" onclick="assignWorker('canteen')">+ 分配</button>
                                <button class="btn-remove" onclick="removeWorker('canteen')">- 撤回</button>
                            </div>
                            <div class="room-progress-bar"><div class="progress-fill" id="progress-canteen"></div></div>
                        </div>

                        <!-- 浴室 / 净水室 -->
                        <div class="room shower" id="room-shower">
                            <div class="room-header">
                                <h3>💧 浴室/水处理室 (生产净水)</h3>
                                <div class="room-stats">
                                    工人: <span class="worker-count">0</span> / 20
                                </div>
                            </div>
                            <div class="room-actions">
                                <button class="btn-assign" onclick="assignWorker('shower')">+ 分配</button>
                                <button class="btn-remove" onclick="removeWorker('shower')">- 撤回</button>
                            </div>
                            <div class="room-progress-bar"><div class="progress-fill" id="progress-shower"></div></div>
                        </div>

                        <!-- 宿舍 -->
                        <div class="room dorm" id="room-dorm">
                            <div class="room-header">
                                <h3>🛏️ 宿舍 (维持士气)</h3>
                                <div class="room-stats">
                                    休息中: <span class="worker-count">0</span> / 60
                                </div>
                            </div>
                            <div class="room-actions">
                                <button class="btn-assign" onclick="assignWorker('dorm')">+ 分配</button>
                                <button class="btn-remove" onclick="removeWorker('dorm')">- 撤回</button>
                            </div>
                            <div class="room-progress-bar"><div class="progress-fill" id="progress-dorm"></div></div>
                        </div>

                    </div>
                </div>
            </div>
        </main>

        <!-- 底部日志栏 -->
        <footer id="log-bar">
            <div id="event-log">欢迎来到避难所！你的任务是带领 100 名幸存者在地底生存下去。</div>
        </footer>
    </div>

    <!-- 游戏结束弹窗 -->
    <div id="game-over-modal" class="hidden">
        <div class="modal-content">
            <h2>游戏结束</h2>
            <p id="game-over-reason">所有的幸存者都已遇难...</p>
            <button onclick="location.reload()">重新开始</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
