<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老虎超市模拟器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="top-bar">
        <div class="stats">
            <span>资金: ¥<span id="money-display">0</span></span>
            <span>客流量: <span id="customer-count">0</span></span>
            <span style="margin-left: 20px; font-size: 14px; color: #ccc;">提示: 鼠标控制移动 | 靠近右侧退货区处理退款</span>
        </div>
        <div class="upgrades">
            <button id="tour-bus-btn" style="background-color: #e67e22;">🚌 旅游团 (2-100人)</button>
        </div>
    </div>

    <div class="game-container">
        <!-- 老虎背景超市 -->
        <div class="full-shop" id="shop">
            <div id="entrance">入口</div>
            
            <!-- 货架 (左上角和左下角) -->
            <div id="shelves-top-left"></div>
            <div id="shelves-bottom-left"></div>

            <div class="checkout-area" id="checkout-area">
                <!-- 收银员 -->
            </div>
            
            <div id="refund-area" style="position:absolute; top:100px; left:1600px; width:150px; height:80px; background:#f39c12; border:3px dashed #d35400; border-radius:10px; color:white; font-weight:bold; display:flex; justify-content:center; align-items:center; z-index:5;">
                退货区
            </div>
            
            <!-- 玩家结账操作面板 (现在用于退货) -->
            <div id="player-checkout-ui" class="checkout-ui" style="display: none;">
                <div id="checkout-text"></div>
                <div id="refund-buttons" style="margin-top: 10px;">
                    <button id="btn-accept" class="btn-yes">退货</button>
                    <button id="btn-reject" class="btn-no">不退货</button>
                </div>
                <div id="fight-buttons" style="margin-top: 10px; display: none;">
                    <button id="btn-hit" class="btn-no">打它</button>
                    <button id="btn-nohit" class="btn-yes" style="background:#95a5a6;">不打它</button>
                </div>
            </div>
            
            <!-- 老板(你) -->
            <div id="player" class="character player-char">
                <div class="face-parts">
                    <div class="hair" style="background: #2c3e50;"></div>
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="nose"></div>
                    <div class="mouth" style="background: #e74c3c;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/items.js"></script>
    <script src="js/character.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
