<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>无敌贪吃蛇 - 小游戏中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a1a0f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 20px;
            pointer-events: auto;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .stats-panel {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: right;
            backdrop-filter: blur(4px);
        }

        .stats-panel div {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 2px 0;
        }

        .leaderboard {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
            text-align: left;
        }
        .leaderboard ol {
            list-style-position: inside;
            padding-left: 0;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .overlay h2 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #4CAF50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .overlay p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ddd;
        }

        .btn {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover {
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        #joystick-area {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            pointer-events: auto;
            touch-action: none;
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="header">
            <a href="../../index.html" class="back-btn">← 返回大厅</a>
            <div class="stats-panel">
                <div>长度: <span id="score">0</span></div>
                <div>击杀: <span id="kills">0</span></div>
                <div class="leaderboard">
                    <div style="color:white; margin-bottom:5px;">当前排名</div>
                    <ol id="rank-list"></ol>
                </div>
            </div>
        </div>
        
        <div id="joystick-area"></div>
        <div class="instruction">PC端移动鼠标控制方向 / 移动端触摸屏幕控制方向</div>
    </div>

    <div class="overlay" id="start-screen">
        <h2>无敌贪吃蛇</h2>
        <p>大蛇吃小蛇！碰到边界会反弹，努力成为霸主吧！</p>
        <button class="btn" id="start-btn">开始进入游戏</button>
    </div>

    <div class="overlay hidden" id="game-over-screen">
        <h2 style="color: #F44336;">你被击败了</h2>
        <p>最终长度: <span id="final-score">0</span> | 击杀数: <span id="final-kills">0</span></p>
        <button class="btn" id="restart-btn">再次挑战</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const killsEl = document.getElementById('kills');
        const rankListEl = document.getElementById('rank-list');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        
        // Sound Effects (Web Audio API synth)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'kill') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'super') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'shrink') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }
        const MAP_SIZE = 4000;
        const GRID_SIZE = 100;
        const BASE_SPEED = 4;
        const SEGMENT_SPACING = 5; // How many history frames between segments

        // State
        let isGameRunning = false;
        let animationId;
        let cameraX = 0;
        let cameraY = 0;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let usingTouch = false;

        let snakes = [];
        let foods = [];
        let projectiles = [];
        let player = null;

        // Resize
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Utility
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function distance(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }
        function randomColor() {
            const hues = [0, 30, 60, 120, 180, 210, 240, 270, 300, 330];
            const h = hues[randomInt(0, hues.length - 1)];
            return `hsl(${h}, 80%, 50%)`;
        }

        class Projectile {
            constructor(x, y, angle, owner) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.owner = owner;
                this.speed = 15;
                this.radius = 20;
                this.alive = true;
                this.life = 100; // frames
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.life--;
                if (this.life <= 0 || this.x < 0 || this.x > MAP_SIZE || this.y < 0 || this.y > MAP_SIZE) {
                    this.alive = false;
                }
            }
            draw(ctx) {
                ctx.fillStyle = '#FF5722';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fill();
                // Draw a simple face to look like a snake head
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(this.x + Math.cos(this.angle+1)*10, this.y + Math.sin(this.angle+1)*10, 5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(this.x + Math.cos(this.angle-1)*10, this.y + Math.sin(this.angle-1)*10, 5, 0, Math.PI*2); ctx.fill();
            }
        }

        class Snake {
            constructor(x, y, isPlayer = false, name = "Bot") {
                this.x = x;
                this.y = y;
                this.isPlayer = isPlayer;
                this.name = isPlayer ? "你" : name;
                this.angle = Math.random() * Math.PI * 2;
                this.targetAngle = this.angle;
                this.speed = BASE_SPEED;
                this.length = isPlayer ? 20 : randomInt(10, 50); // initial segments
                this.radius = 12;
                this.color = isPlayer ? '#4CAF50' : randomColor();
                this.history = [];
                this.alive = true;
                this.kills = 0;
                this.consecutiveKills = 0;
                this.isSuperGiant = false;
                
                // Init history
                for(let i=0; i<this.length * SEGMENT_SPACING; i++) {
                    this.history.push({x: this.x, y: this.y});
                }
            }

            update() {
                if (!this.alive) return;

                // AI Logic
                if (!this.isPlayer) {
                    this.updateAI();
                } else {
                    // Player input (mouse relative to center screen)
                    if (usingTouch || distance(mouseX, mouseY, canvas.width/2, canvas.height/2) > 20) {
                        this.targetAngle = Math.atan2(mouseY - canvas.height/2, mouseX - canvas.width/2);
                    }
                }

                // Smooth turn
                let diff = this.targetAngle - this.angle;
                // Normalize diff to -PI to PI
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                
                const turnSpeed = 0.1;
                if (Math.abs(diff) < turnSpeed) {
                    this.angle = this.targetAngle;
                } else {
                    this.angle += Math.sign(diff) * turnSpeed;
                }

                // Move
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // Map Boundaries (Bounce)
                if (this.x < this.radius) { this.x = this.radius; this.angle = Math.PI - this.angle; this.targetAngle = this.angle; }
                if (this.x > MAP_SIZE - this.radius) { this.x = MAP_SIZE - this.radius; this.angle = Math.PI - this.angle; this.targetAngle = this.angle; }
                if (this.y < this.radius) { this.y = this.radius; this.angle = -this.angle; this.targetAngle = this.angle; }
                if (this.y > MAP_SIZE - this.radius) { this.y = MAP_SIZE - this.radius; this.angle = -this.angle; this.targetAngle = this.angle; }

                // Update history
                this.history.unshift({x: this.x, y: this.y});
                
                // Adjust radius based on length
                if (this.isSuperGiant) {
                    this.radius = 150; // Super Giant Size
                } else {
                    this.radius = 10 + Math.floor(this.length / 20);
                }
                this.speed = BASE_SPEED + (this.isPlayer && usingTouch ? 1 : 0); // slightly faster on touch? No, let's keep uniform.

                // Trim history
                const maxHistory = this.length * SEGMENT_SPACING;
                if (this.history.length > maxHistory) {
                    this.history.length = maxHistory;
                }
            }

            updateAI() {
                // Very simple AI
                // 1. Target player if player is super giant (to shrink them) or if close
                // 2. Avoid larger snakes
                // 3. Chase smaller snakes
                // 4. Chase food
                // 5. Wander
                if (Math.random() < 0.05) { // Evaluate every few frames
                    let target = null;
                    let minDist = 500;
                    
                    // If player exists, target player's head aggressively
                    if (player && player.alive) {
                        let distToPlayer = distance(this.x, this.y, player.x, player.y);
                        if (distToPlayer < 800) {
                            this.targetAngle = Math.atan2(player.y - this.y, player.x - this.x);
                            return;
                        }
                    }
                    
                    // Check snakes
                    for (let other of snakes) {
                        if (other === this || !other.alive) continue;
                        let dist = distance(this.x, this.y, other.x, other.y);
                        if (dist < 400) {
                            if (other.length > this.length) {
                                // Flee
                                this.targetAngle = Math.atan2(this.y - other.y, this.x - other.x);
                                return;
                            } else if (dist < minDist) {
                                // Chase
                                minDist = dist;
                                target = {x: other.x, y: other.y};
                            }
                        }
                    }

                    // Check food if no snake to chase
                    if (!target) {
                        for (let f of foods) {
                            let dist = distance(this.x, this.y, f.x, f.y);
                            if (dist < minDist) {
                                minDist = dist;
                                target = f;
                            }
                        }
                    }

                    if (target) {
                        this.targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    } else {
                        // Random wander
                        if (Math.random() < 0.2) {
                            this.targetAngle += (Math.random() - 0.5) * Math.PI;
                        }
                    }
                }
            }

            draw(ctx) {
                if (!this.alive) return;

                // Draw body from tail to head
                for (let i = this.length - 1; i >= 0; i--) {
                    let index = i * SEGMENT_SPACING;
                    if (index >= this.history.length) index = this.history.length - 1;
                    let pos = this.history[index];
                    if (!pos) continue;

                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, this.radius, 0, Math.PI * 2);
                    
                    if (i === 0) {
                        // Head
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        // Eyes
                        ctx.fillStyle = 'white';
                        let eyeOffsetX = Math.cos(this.angle + Math.PI/2) * (this.radius * 0.5);
                        let eyeOffsetY = Math.sin(this.angle + Math.PI/2) * (this.radius * 0.5);
                        
                        ctx.beginPath(); ctx.arc(pos.x + eyeOffsetX, pos.y + eyeOffsetY, this.radius*0.3, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(pos.x - eyeOffsetX, pos.y - eyeOffsetY, this.radius*0.3, 0, Math.PI*2); ctx.fill();
                        
                        ctx.fillStyle = 'black';
                        ctx.beginPath(); ctx.arc(pos.x + eyeOffsetX + Math.cos(this.angle)*2, pos.y + eyeOffsetY + Math.sin(this.angle)*2, this.radius*0.15, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(pos.x - eyeOffsetX + Math.cos(this.angle)*2, pos.y - eyeOffsetY + Math.sin(this.angle)*2, this.radius*0.15, 0, Math.PI*2); ctx.fill();

                        // Name tag
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.font = '12px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText(this.name, pos.x, pos.y - this.radius - 5);

                    } else {
                        // Body
                        ctx.fillStyle = this.color;
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            die(killer) {
                this.alive = false;
                
                playSound('kill');

                // If player is super giant, they absorb everything anywhere
                let autoEatTarget = null;
                if (player && player.isSuperGiant && this !== player) {
                    autoEatTarget = player;
                } else if (killer) {
                    autoEatTarget = killer;
                }

                for (let i = 0; i < this.length; i+=2) {
                    let index = i * SEGMENT_SPACING;
                    if (index < this.history.length) {
                        let pos = this.history[index];
                        let foodSize = randomInt(4, 8);
                        if (autoEatTarget) {
                            // Auto absorb
                            autoEatTarget.length += (foodSize > 5 ? 2 : 1);
                        } else {
                            foods.push({
                                x: pos.x + randomInt(-10, 10),
                                y: pos.y + randomInt(-10, 10),
                                size: foodSize,
                                color: this.color
                            });
                        }
                    }
                }
            }

            shrink() {
                playSound('shrink');
                this.isSuperGiant = false;
                this.consecutiveKills = 0;
                this.length = Math.max(10, Math.floor(this.length / 2));
            }
        }
        }

        function spawnFood(count) {
            for(let i=0; i<count; i++) {
                foods.push({
                    x: randomInt(50, MAP_SIZE - 50),
                    y: randomInt(50, MAP_SIZE - 50),
                    size: randomInt(3, 6),
                    color: randomColor()
                });
            }
        }

        function spawnAI() {
            let s = new Snake(randomInt(100, MAP_SIZE-100), randomInt(100, MAP_SIZE-100), false, "Bot_" + randomInt(100,999));
            if (player && player.isSuperGiant) {
                s.isSuperGiant = true;
                s.length += 200;
            }
            snakes.push(s);
        }

        function initGame() {
            snakes = [];
            foods = [];
            
            // Create player
            player = new Snake(MAP_SIZE/2, MAP_SIZE/2, true);
            snakes.push(player);

            // Create AI
            const aiNames = ["Alpha", "Beta", "Gamma", "Delta", "Echo", "Zeta", "Ninja", "Pro", "Noob", "SnakeKing"];
            for(let i=0; i<15; i++) {
                snakes.push(new Snake(randomInt(100, MAP_SIZE-100), randomInt(100, MAP_SIZE-100), false, aiNames[i%aiNames.length] + "_" + i));
            }

            spawnFood(300);
            
            scoreEl.textContent = player.length;
            killsEl.textContent = player.kills;
        }

        function update() {
            // Respawn AI and food if too few
            if (foods.length < 200) spawnFood(50);
            if (snakes.length < 15) {
                spawnAI();
            }

            // Update all snakes
            snakes.forEach(s => s.update());
            
            // Update projectiles
            projectiles.forEach(p => p.update());

            // Projectile collisions
            for (let p of projectiles) {
                if (!p.alive) continue;
                for (let s of snakes) {
                    if (s === p.owner || !s.alive) continue;
                    // Check projectile hit snake
                    let hit = false;
                    for (let k = 0; k < s.length; k += 3) {
                        let index = k * SEGMENT_SPACING;
                        if (index < s.history.length) {
                            let pos = s.history[index];
                            if (distance(p.x, p.y, pos.x, pos.y) < p.radius + s.radius) {
                                hit = true;
                                break;
                            }
                        }
                    }
                    if (hit) {
                        p.alive = false;
                        if (s.length < p.owner.length) {
                            s.die(p.owner);
                            p.owner.kills++;
                        }
                        break;
                    }
                }
            }
            projectiles = projectiles.filter(p => p.alive);

            // Collisions
            for (let i = 0; i < snakes.length; i++) {
                let A = snakes[i];
                if (!A.alive) continue;

                // Eat food
                for (let f = foods.length - 1; f >= 0; f--) {
                    let food = foods[f];
                    if (distance(A.x, A.y, food.x, food.y) < A.radius + food.size) {
                        foods.splice(f, 1);
                        A.length += (food.size > 5 ? 2 : 1);
                        if(A.isPlayer) playSound('eat');
                    }
                }

                // Eat other snakes (Classic Slither.io rules: If A's head hits B's body, A dies)
                for (let j = 0; j < snakes.length; j++) {
                    if (i === j) continue;
                    let B = snakes[j];
                    if (!B.alive) continue;

                    // Check A's head against B's body segments
                    let headHit = false;
                    
                    // If A is player and super giant, touching ANY part of B kills B
                    if (A.isPlayer && A.isSuperGiant) {
                        let dist = distance(A.x, A.y, B.x, B.y); // Check head to head
                        if (dist < A.radius + B.radius) {
                            headHit = true;
                        } else {
                            // Check A's head to B's body
                            for (let k = 0; k < B.length; k += 3) {
                                let index = k * SEGMENT_SPACING;
                                if (index < B.history.length) {
                                    let pos = B.history[index];
                                    if (distance(A.x, A.y, pos.x, pos.y) < A.radius + B.radius) {
                                        headHit = true;
                                        break;
                                    }
                                }
                            }
                        }
                        
                        if (headHit) {
                            B.die(A);
                            A.kills++;
                            killsEl.textContent = A.kills;
                            
                            // Spawn 2 new snakes when one is killed
                            spawnAI();
                            spawnAI();
                            
                            continue; // Skip the normal head hit logic below
                        }
                    }

                    // Normal collision: Check A's head against B's body segments
                    headHit = false;
                    
                    // Check head to head first (special rule for AI hitting Player head)
                    let headDist = distance(A.x, A.y, B.x, B.y);
                    if (headDist < A.radius + B.radius) {
                        if ( (A.isPlayer && A.isSuperGiant && !B.isPlayer) || 
                             (B.isPlayer && B.isSuperGiant && !A.isPlayer) ) {
                            // AI hits player head
                            A.shrink();
                            B.shrink();
                            
                            // All snakes shrink
                            snakes.forEach(s => s.shrink());
                            continue;
                        }
                    }

                    for (let k = 0; k < B.length; k += 3) { // check every 3rd segment for performance
                        let index = k * SEGMENT_SPACING;
                        if (index < B.history.length) {
                            let pos = B.history[index];
                            if (distance(A.x, A.y, pos.x, pos.y) < A.radius + B.radius) {
                                headHit = true;
                                break;
                            }
                        }
                    }

                    if (headHit) {
                        // Super Giant snakes don't die
                        if (!A.isSuperGiant) {
                            A.die(B); // B is the killer
                            B.kills++;
                            B.consecutiveKills++;
                            
                            // Spawn 2 new snakes
                            spawnAI();
                            spawnAI();
                            
                            // Become Super Giant after 3 consecutive kills
                            if (B.consecutiveKills >= 3 && !B.isSuperGiant) {
                                playSound('super');
                                B.isSuperGiant = true;
                                B.length += 200; // Give a massive length boost
                                if (B.isPlayer) {
                                    alert("连续击杀3条蛇，你已化身超级大蛇！所有敌人也变大了，但你一碰他们就会死，且你会自动吸取全图能量！");
                                    // Make all existing AI giant too
                                    snakes.forEach(s => {
                                        if (!s.isPlayer && !s.isSuperGiant) {
                                            s.isSuperGiant = true;
                                            s.length += 200;
                                        }
                                    });
                                }
                            }

                            if(B.isPlayer) killsEl.textContent = B.kills;
                        } else {
                            // Super giant bounce off others
                            A.angle += Math.PI;
                            A.targetAngle = A.angle;
                        }
                        break; // A hit B, stop checking for A
                    }
                }
            }

            // Clean up dead snakes
            snakes = snakes.filter(s => s.alive);

            // Update UI
            if (player.alive) {
                scoreEl.textContent = player.length;
            } else if (isGameRunning) {
                gameOver();
            }

            // Update Leaderboard
            let sortedSnakes = [...snakes].sort((a, b) => b.length - a.length).slice(0, 5);
            rankListEl.innerHTML = '';
            sortedSnakes.forEach(s => {
                let li = document.createElement('li');
                li.style.color = s.isPlayer ? '#4CAF50' : 'white';
                li.textContent = `${s.name} - ${s.length}`;
                rankListEl.appendChild(li);
            });

            // Update Camera
            if (player.alive) {
                // Smooth camera follow
                cameraX += (player.x - canvas.width / 2 - cameraX) * 0.1;
                cameraY += (player.y - canvas.height / 2 - cameraY) * 0.1;
            }
        }

        function draw() {
            // Clear - Dark green background
            ctx.fillStyle = '#0a1a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            // Draw Grid
            ctx.strokeStyle = 'rgba(46, 139, 87, 0.2)'; // Dark sea green for grid
            ctx.lineWidth = 1;
            let startX = Math.floor(cameraX / GRID_SIZE) * GRID_SIZE;
            let startY = Math.floor(cameraY / GRID_SIZE) * GRID_SIZE;
            
            ctx.beginPath();
            for (let x = startX; x < cameraX + canvas.width + GRID_SIZE; x += GRID_SIZE) {
                if (x >= 0 && x <= MAP_SIZE) {
                    ctx.moveTo(x, Math.max(0, cameraY));
                    ctx.lineTo(x, Math.min(MAP_SIZE, cameraY + canvas.height));
                }
            }
            for (let y = startY; y < cameraY + canvas.height + GRID_SIZE; y += GRID_SIZE) {
                if (y >= 0 && y <= MAP_SIZE) {
                    ctx.moveTo(Math.max(0, cameraX), y);
                    ctx.lineTo(Math.min(MAP_SIZE, cameraX + canvas.width), y);
                }
            }
            ctx.stroke();

            // Draw Map Borders
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

            // Draw Foods
            foods.forEach(f => {
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.size, 0, Math.PI*2);
                ctx.fill();
            });

            // Draw Projectiles
            projectiles.forEach(p => p.draw(ctx));

            // Draw Snakes (dead ones first, then others, player on top)
            snakes.sort((a, b) => (a.isPlayer ? 1 : 0) - (b.isPlayer ? 1 : 0));
            snakes.forEach(s => s.draw(ctx));

            ctx.restore();
        }

        function mainLoop() {
            if (!isGameRunning) return;
            update();
            draw();
            animationId = requestAnimationFrame(mainLoop);
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            initGame();
            isGameRunning = true;
            if (animationId) cancelAnimationFrame(animationId);
            mainLoop();
        }

        function gameOver() {
            isGameRunning = false;
            document.getElementById('final-score').textContent = player.length;
            document.getElementById('final-kills').textContent = player.kills;
            gameOverScreen.classList.remove('hidden');
        }

        // Inputs
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            usingTouch = false;
        });

        window.addEventListener('keydown', e => {
            if (e.key === 't' || e.key === 'T') {
                if (player && player.alive && player.isSuperGiant) {
                    // Fire snake head
                    playSound('shoot');
                    projectiles.push(new Projectile(player.x, player.y, player.angle, player));
                }
            }
        });

        // Mobile joystick/touch handling
        const joystickArea = document.getElementById('joystick-area');
        joystickArea.addEventListener('touchstart', handleTouch, {passive: false});
        joystickArea.addEventListener('touchmove', handleTouch, {passive: false});

        function handleTouch(e) {
            e.preventDefault();
            usingTouch = true;
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        }

        // Draw initial static background
        ctx.fillStyle = '#0a1a0f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    </script>
</body>
</html>
