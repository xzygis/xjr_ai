<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>数学跑酷 (Math Runner)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Noto Sans SC',sans-serif;overflow:hidden}
#game-container{position:relative;width:900px;height:500px;border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(100,140,255,0.3)}
canvas{display:block;background:#0d1225}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
#score-display{position:absolute;top:12px;left:16px;font-size:22px;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(100,200,255,0.8)}
#lives-display{position:absolute;top:12px;right:16px;font-size:20px}
#stamina-bar-bg{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:300px;height:14px;background:rgba(0,0,0,0.6);border-radius:7px;border:1px solid rgba(255,255,255,0.2)}
#stamina-bar{height:100%;border-radius:7px;transition:width 0.1s,background 0.3s;width:100%;background:linear-gradient(90deg,#4af,#2df)}
#buff-icons{position:absolute;top:44px;left:16px;display:flex;gap:8px}
.buff-icon{background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:4px 8px;font-size:13px;color:#fff;display:flex;align-items:center;gap:4px}
#notification{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,0.8);opacity:0;transition:opacity 0.3s;pointer-events:none;text-align:center}
#otherworld-bar-bg{position:absolute;top:50px;left:50%;transform:translateX(-50%);width:200px;height:8px;background:rgba(0,0,0,0.6);border-radius:4px;display:none}
#otherworld-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,#f44,#f80);width:100%}
#arrow-hint{position:absolute;bottom:40px;right:16px;font-size:14px;color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,0.5);display:none}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(8,12,30,0.92);z-index:10}
#overlay h2{font-size:36px;color:#fff;margin-bottom:12px;text-shadow:0 0 20px rgba(100,180,255,0.6)}
#overlay p{color:#a8c4e8;font-size:15px;margin:4px 0;line-height:1.6}
#overlay .controls{margin:16px 0;color:#7ab;font-size:13px}
#start-btn{margin-top:20px;padding:12px 36px;font-size:18px;font-weight:700;border:none;border-radius:8px;background:linear-gradient(135deg,#4af,#28f);color:#fff;cursor:pointer;transition:transform 0.1s}
#start-btn:hover{transform:scale(1.05)}
#final-score{font-size:24px;color:#ffd700;margin:8px 0}
#math-modal{position:absolute;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;background:rgba(8,12,30,0.85);z-index:20;pointer-events:auto}
#math-box{background:linear-gradient(135deg,#1a2a4a,#0f1a30);border:2px solid rgba(100,180,255,0.4);border-radius:16px;padding:28px 36px;text-align:center;box-shadow:0 0 30px rgba(50,120,255,0.3)}
#math-question{font-size:28px;color:#fff;margin-bottom:16px;font-weight:700}
#math-input{width:120px;padding:10px;font-size:22px;text-align:center;border:2px solid #4af;border-radius:8px;background:rgba(0,0,0,0.5);color:#fff;outline:none;font-family:'Noto Sans SC',sans-serif}
#math-input:focus{border-color:#6cf;box-shadow:0 0 12px rgba(100,200,255,0.4)}
#math-submit{margin-left:8px;padding:10px 20px;font-size:18px;border:none;border-radius:8px;background:#4af;color:#fff;cursor:pointer;font-weight:700}
#math-feedback{margin-top:12px;font-size:16px;min-height:24px}
</style>
</head>
<body>
<div id="game-container">
<canvas id="canvas" width="900" height="500"></canvas>
<div id="hud">
  <div id="score-display">分数: 0</div>
  <div id="lives-display">❤️❤️❤️</div>
  <div id="buff-icons"></div>
  <div id="notification"></div>
  <div id="otherworld-bar-bg"><div id="otherworld-bar"></div></div>
  <div id="stamina-bar-bg"><div id="stamina-bar"></div></div>
  <div id="arrow-hint">按 P 射箭</div>
</div>
<div id="overlay">
  <h2>数学跑酷</h2>
  <p>奔跑、跳跃、躲避障碍！</p>
  <p>撞到障碍物需回答数学题，答错3次游戏结束</p>
  <div class="controls">
    <p>空格/↑/W 跳跃 | →/D 加速</p>
    <p>收集宝箱获得强力Buff！</p>
  </div>
  <button id="start-btn">开始游戏</button>
  <div id="final-score"></div>
</div>
<div id="math-modal">
  <div id="math-box">
    <div id="math-question"></div>
    <div><input id="math-input" type="number" autocomplete="off"/><button id="math-submit">确定</button></div>
    <div id="math-feedback"></div>
  </div>
</div>
</div>

<script>
(function(){
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const W=900,H=500;
const GROUND_Y=420;

// DOM refs
const scoreDisplay=document.getElementById('score-display');
const livesDisplay=document.getElementById('lives-display');
const staminaBar=document.getElementById('stamina-bar');
const buffIcons=document.getElementById('buff-icons');
const notification=document.getElementById('notification');
const overlay=document.getElementById('overlay');
const startBtn=document.getElementById('start-btn');
const finalScore=document.getElementById('final-score');
const mathModal=document.getElementById('math-modal');
const mathQuestion=document.getElementById('math-question');
const mathInput=document.getElementById('math-input');
const mathSubmit=document.getElementById('math-submit');
const mathFeedback=document.getElementById('math-feedback');
const otherworldBarBg=document.getElementById('otherworld-bar-bg');
const otherworldBar=document.getElementById('otherworld-bar');
const arrowHint=document.getElementById('arrow-hint');

// Game state
let running=false,paused=false;
let score=0,lives=3,wrongCount=0;
let stamina=100,maxStamina=100;
let gameSpeed=5;
let frameCount=0;

// Player
let player={x:80,y:GROUND_Y,w:30,h:40,vy:0,onGround:true,frame:0,frameTimer:0};
let jumping=false,accelerating=false;
const GRAVITY=0.65,JUMP_FORCE=-13;

// Obstacles
let obstacles=[];
let obstacleTimer=0;
const OBS_TYPES=[
  {type:'spike',w:30,h:25,color:'#f55'},
  {type:'block',w:50,h:30,color:'#fa0'},
  {type:'tall',w:30,h:45,color:'#f0a'}
];

// Chests
let chests=[];
let chestTimer=0;

// Buffs
let buffs={rocket:0,jetpack:0,shoes:0,bow:0,shield:0};
let isFlying=false;
let flyY=GROUND_Y-80;

// Arrows
let arrows=[];
let arrowCooldown=0;

// Particles
let particles=[];

// Otherworld
let inOtherworld=false;
let otherworldType=''; // 'lava' or 'spike'
let otherworldTimer=0;
let otherworldDuration=540; // ~9s at 60fps
let otherworldObstacles=[];

// Math
let currentMathAnswer=0;
let mathCallback=null;
let mathIsOtherworld=false;

// Keys
let keys={};

// Notification
let notifTimer=0;

function init(){
  score=0;lives=3;wrongCount=0;stamina=100;
  gameSpeed=5;frameCount=0;
  player={x:80,y:GROUND_Y,w:30,h:40,vy:0,onGround:true,frame:0,frameTimer:0};
  obstacles=[];chests=[];arrows=[];particles=[];
  buffs={rocket:0,jetpack:0,shoes:0,bow:0,shield:0};
  isFlying=false;
  inOtherworld=false;otherworldObstacles=[];
  obstacleTimer=0;chestTimer=0;arrowCooldown=0;
  paused=false;
  updateHUD();
}

function start(){
  init();
  running=true;
  overlay.style.display='none';
  finalScore.textContent='';
  requestAnimationFrame(loop);
}

function gameOver(){
  running=false;
  overlay.style.display='flex';
  overlay.querySelector('h2').textContent='游戏结束';
  finalScore.textContent='最终得分: '+score;
  startBtn.textContent='重新开始';
}

// Math system
function generateMath(){
  let ops=['+','-','×'];
  let op=ops[Math.floor(Math.random()*3)];
  let a,b,ans;
  if(op==='×'){
    a=Math.floor(Math.random()*8)+2;
    b=Math.floor(Math.random()*8)+2;
    ans=a*b;
  }else if(op==='+'){
    a=Math.floor(Math.random()*50)+10;
    b=Math.floor(Math.random()*50)+10;
    ans=a+b;
  }else{
    a=Math.floor(Math.random()*50)+20;
    b=Math.floor(Math.random()*a)+1;
    ans=a-b;
  }
  return {q:a+' '+op+' '+b+' = ?',a:ans};
}

function showMath(isOW,callback){
  paused=true;
  mathIsOtherworld=isOW;
  let m=generateMath();
  currentMathAnswer=m.a;
  mathCallback=callback;
  mathQuestion.textContent=m.q;
  mathInput.value='';
  mathFeedback.textContent='';
  mathFeedback.style.color='';
  mathModal.style.display='flex';
  setTimeout(()=>mathInput.focus(),50);
}

function submitMath(){
  let val=parseInt(mathInput.value);
  if(isNaN(val))return;
  if(val===currentMathAnswer){
    mathFeedback.textContent='✓ 正确！';
    mathFeedback.style.color='#4f8';
    setTimeout(()=>{
      mathModal.style.display='none';
      paused=false;
      if(mathCallback)mathCallback(true);
    },500);
  }else{
    wrongCount++;
    lives=3-wrongCount;
    updateHUD();
    mathFeedback.textContent='✗ 错误！正确答案: '+currentMathAnswer;
    mathFeedback.style.color='#f55';
    if(wrongCount>=3){
      setTimeout(()=>{
        mathModal.style.display='none';
        gameOver();
      },800);
    }else{
      setTimeout(()=>{
        mathModal.style.display='none';
        paused=false;
        if(mathCallback)mathCallback(false);
      },800);
    }
  }
}

mathSubmit.addEventListener('click',submitMath);
mathInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitMath();});

// Chest rewards
function openYellowChest(){
  let r=Math.random()*100;
  if(r<3){
    buffs.bow=7200; // 2min
    showNotif('🏹 超稀有：弓箭！持续2分钟');
    arrowHint.style.display='block';
  }else if(r<8){
    buffs.shield=7200;
    showNotif('🛡️ 传说：盾牌！持续2分钟');
  }else if(r<18){
    buffs.rocket=2400; // 40s
    showNotif('🚀 稀有：火箭！持续40秒');
    activateFlight();
  }else if(r<48){
    buffs.jetpack=2400;
    showNotif('🎒 喷气背包！持续40秒');
    activateFlight();
  }else{
    buffs.shoes=2400;
    showNotif('👟 弹跳鞋！持续40秒');
    activateFlight();
  }
}

function activateFlight(){
  isFlying=true;
  player.vy=-10;
}

function enterOtherworld(){
  inOtherworld=true;
  otherworldType=Math.random()<0.5?'lava':'spike';
  otherworldTimer=otherworldDuration;
  otherworldObstacles=[];
  otherworldBarBg.style.display='block';
  showNotif('⚡ 传送到'+(otherworldType==='lava'?'岩浆世界':'尖刺世界')+'！');
}

function exitOtherworld(){
  inOtherworld=false;
  otherworldBarBg.style.display='none';
  otherworldObstacles=[];
  showNotif('✨ 返回正常世界！');
}

function showNotif(text){
  notification.textContent=text;
  notification.style.opacity='1';
  notifTimer=180;
}

// Input
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&running&&!paused){
    if(player.onGround&&!isFlying){
      player.vy=JUMP_FORCE;
      player.onGround=false;
    }
    e.preventDefault();
  }
  if(e.code==='KeyP'&&running&&!paused&&buffs.bow>0){
    fireArrow();
  }
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
startBtn.addEventListener('click',start);

function fireArrow(){
  if(arrowCooldown>0)return;
  arrowCooldown=15;
  arrows.push({x:player.x+player.w,y:player.y+12,vx:14,w:20,h:4});
}

// Game loop
function loop(){
  if(!running)return;
  if(!paused){
    update();
  }
  render();
  requestAnimationFrame(loop);
}

function update(){
  frameCount++;
  score+=Math.floor(gameSpeed/3);
  gameSpeed=5+Math.floor(score/500)*0.5;
  if(gameSpeed>14)gameSpeed=14;

  // Stamina
  let staminaDrain=0.08;
  accelerating=keys['ArrowRight']||keys['KeyD'];
  if(accelerating)staminaDrain=0.24;
  stamina-=staminaDrain;
  if(stamina<0)stamina=0;
  // Regen when not accelerating
  if(!accelerating&&stamina<maxStamina){
    stamina+=0.04;
  }

  // Speed modifier
  let speedMod=1;
  if(stamina>=95)speedMod=2.2;
  else if(stamina<=25)speedMod=0.55;
  else speedMod=1+(accelerating?0.4:0);

  let currentSpeed=gameSpeed*speedMod;

  // Update buffs
  for(let k in buffs){if(buffs[k]>0)buffs[k]--;}
  if(buffs.bow<=0)arrowHint.style.display='none';
  // Check flying
  let flyBuff=buffs.rocket>0||buffs.jetpack>0||buffs.shoes>0;
  if(!flyBuff&&isFlying){
    isFlying=false;
  }

  // Player physics
  if(isFlying){
    let targetY=GROUND_Y-80;
    player.vy+=(targetY-player.y)*0.05;
    player.vy*=0.85;
    player.y+=player.vy;
    player.onGround=false;
  }else{
    player.vy+=GRAVITY;
    player.y+=player.vy;
    if(player.y>=GROUND_Y){
      player.y=GROUND_Y;
      player.vy=0;
      player.onGround=true;
    }
  }

  // Animation frame
  player.frameTimer++;
  if(player.frameTimer>6){player.frame=(player.frame+1)%4;player.frameTimer=0;}

  // Arrow cooldown
  if(arrowCooldown>0)arrowCooldown--;

  // Arrows update
  for(let i=arrows.length-1;i>=0;i--){
    arrows[i].x+=arrows[i].vx;
    if(arrows[i].x>W){arrows.splice(i,1);continue;}
    // Check arrow-obstacle collision
    let arr=arrows[i];
    let obsList=inOtherworld?otherworldObstacles:obstacles;
    for(let j=obsList.length-1;j>=0;j--){
      let o=obsList[j];
      if(arr.x+arr.w>o.x&&arr.x<o.x+o.w&&arr.y+arr.h>o.y&&arr.y<o.y+o.h){
        // Destroy obstacle
        spawnExplosion(o.x+o.w/2,o.y+o.h/2,o.color||'#fa0');
        obsList.splice(j,1);
        arrows.splice(i,1);
        score+=50;
        break;
      }
    }
  }

  // Otherworld
  if(inOtherworld){
    otherworldTimer--;
    otherworldBar.style.width=(otherworldTimer/otherworldDuration*100)+'%';
    if(otherworldTimer<=0)exitOtherworld();

    // Generate otherworld obstacles
    if(frameCount%50===0){
      let ow;
      if(otherworldType==='lava'){
        ow={x:W,y:GROUND_Y-5,w:60,h:25,type:'lava',color:'#f40',bubbleT:0};
      }else{
        ow={x:W,y:GROUND_Y-40,w:25,h:40,type:'owspike',color:'#888'};
      }
      otherworldObstacles.push(ow);
    }
    for(let i=otherworldObstacles.length-1;i>=0;i--){
      otherworldObstacles[i].x-=currentSpeed;
      if(otherworldObstacles[i].type==='lava')otherworldObstacles[i].bubbleT++;
      if(otherworldObstacles[i].x+otherworldObstacles[i].w<0)otherworldObstacles.splice(i,1);
    }
    // Player collision with OW obstacles
    if(!isFlying||!checkFlyAbove()){
      for(let i=otherworldObstacles.length-1;i>=0;i--){
        let o=otherworldObstacles[i];
        if(collides(player,o)){
          if(buffs.shield>0){
            spawnExplosion(o.x+o.w/2,o.y+o.h/2,'#4af');
            otherworldObstacles.splice(i,1);
          }else{
            otherworldObstacles.splice(i,1);
            showMath(true,(correct)=>{});
          }
          break;
        }
      }
    }
  }else{
    // Normal world obstacles
    obstacleTimer--;
    if(obstacleTimer<=0){
      let t=OBS_TYPES[Math.floor(Math.random()*3)];
      obstacles.push({x:W,y:GROUND_Y-t.h+player.h,w:t.w,h:t.h,type:t.type,color:t.color});
      obstacleTimer=Math.floor(80+Math.random()*60-Math.min(score/200,30));
      if(obstacleTimer<35)obstacleTimer=35;
    }
    for(let i=obstacles.length-1;i>=0;i--){
      obstacles[i].x-=currentSpeed;
      if(obstacles[i].x+obstacles[i].w<0){obstacles.splice(i,1);}
    }
    // Player collision with obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      let o=obstacles[i];
      if(collides(player,o)){
        if(buffs.shield>0){
          spawnExplosion(o.x+o.w/2,o.y+o.h/2,'#4af');
          obstacles.splice(i,1);
          score+=30;
        }else{
          obstacles.splice(i,1);
          showMath(false,(correct)=>{});
        }
        break;
      }
    }

    // Chests
    chestTimer--;
    if(chestTimer<=0){
      let isPurple=Math.random()<0.3;
      chests.push({x:W,y:GROUND_Y-20+player.h,w:28,h:28,purple:isPurple});
      chestTimer=Math.floor(200+Math.random()*150);
    }
    for(let i=chests.length-1;i>=0;i--){
      chests[i].x-=currentSpeed;
      if(chests[i].x+chests[i].w<0){chests.splice(i,1);continue;}
      if(collides(player,chests[i])){
        let c=chests[i];
        chests.splice(i,1);
        if(c.purple){
          enterOtherworld();
        }else{
          openYellowChest();
        }
        break;
      }
    }
  }

  // Particles
  // Running dust
  if(player.onGround&&frameCount%4===0&&!isFlying){
    particles.push({x:player.x,y:player.y+player.h,vx:-1-Math.random(),vy:-Math.random()*2,life:20,maxLife:20,color:'rgba(200,200,200,',size:3+Math.random()*2});
  }
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  // Notification timer
  if(notifTimer>0){notifTimer--;if(notifTimer===0)notification.style.opacity='0';}

  updateHUD();
}

function checkFlyAbove(){
  return player.y+player.h<GROUND_Y-10;
}

function collides(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function spawnExplosion(x,y,color){
  for(let i=0;i<12;i++){
    let ang=Math.random()*Math.PI*2;
    let spd=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:30,maxLife:30,color:color,size:3+Math.random()*3,explosion:true});
  }
}

function updateHUD(){
  scoreDisplay.textContent='分数: '+score;
  let hearts='';for(let i=0;i<lives;i++)hearts+='❤️';
  livesDisplay.textContent=hearts;
  // Stamina bar
  staminaBar.style.width=stamina+'%';
  if(stamina>=95)staminaBar.style.background='linear-gradient(90deg,#ffd700,#ffaa00)';
  else if(stamina<=25)staminaBar.style.background='linear-gradient(90deg,#f44,#a00)';
  else staminaBar.style.background='linear-gradient(90deg,#4af,#28f)';
  // Buff icons
  let html='';
  if(buffs.bow>0)html+='<div class="buff-icon">🏹 '+Math.ceil(buffs.bow/60)+'s</div>';
  if(buffs.shield>0)html+='<div class="buff-icon">🛡️ '+Math.ceil(buffs.shield/60)+'s</div>';
  if(buffs.rocket>0)html+='<div class="buff-icon">🚀 '+Math.ceil(buffs.rocket/60)+'s</div>';
  if(buffs.jetpack>0)html+='<div class="buff-icon">🎒 '+Math.ceil(buffs.jetpack/60)+'s</div>';
  if(buffs.shoes>0)html+='<div class="buff-icon">👟 '+Math.ceil(buffs.shoes/60)+'s</div>';
  buffIcons.innerHTML=html;
}

// Render
function render(){
  ctx.clearRect(0,0,W,H);

  if(inOtherworld){
    renderOtherworld();
  }else{
    renderNormalWorld();
  }

  // Player
  renderPlayer();

  // Obstacles
  if(!inOtherworld){
    obstacles.forEach(o=>renderObstacle(o));
    chests.forEach(c=>renderChest(c));
  }else{
    otherworldObstacles.forEach(o=>renderOWObstacle(o));
  }

  // Arrows
  arrows.forEach(a=>{
    ctx.fillStyle='#ffd700';
    ctx.shadowColor='#ffa500';ctx.shadowBlur=6;
    ctx.fillRect(a.x,a.y,a.w,a.h);
    // Arrowhead
    ctx.beginPath();
    ctx.moveTo(a.x+a.w,a.y-3);
    ctx.lineTo(a.x+a.w+8,a.y+a.h/2);
    ctx.lineTo(a.x+a.w,a.y+a.h+3);
    ctx.fill();
    ctx.shadowBlur=0;
  });

  // Particles
  particles.forEach(p=>{
    let alpha=p.life/p.maxLife;
    if(p.explosion){
      ctx.fillStyle=p.color;
      ctx.globalAlpha=alpha;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*alpha,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    }else{
      ctx.fillStyle=p.color+(alpha*0.6)+')';
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      ctx.fill();
    }
  });
}

function renderNormalWorld(){
  // Sky gradient
  let grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#0a0e2a');
  grd.addColorStop(0.6,'#101833');
  grd.addColorStop(1,'#1a1040');
  ctx.fillStyle=grd;
  ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<30;i++){
    let sx=(i*137+frameCount*0.1)%W;
    let sy=(i*89)%200;
    ctx.fillRect(sx,sy,1.5,1.5);
  }

  // Ground
  ctx.fillStyle='#1a2040';
  ctx.fillRect(0,GROUND_Y+player.h,W,H-GROUND_Y-player.h);
  ctx.strokeStyle='rgba(100,180,255,0.3)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y+player.h);
  ctx.lineTo(W,GROUND_Y+player.h);
  ctx.stroke();

  // Neon ground line glow
  ctx.shadowColor='#4af';ctx.shadowBlur=8;
  ctx.strokeStyle='#4af';
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y+player.h);
  ctx.lineTo(W,GROUND_Y+player.h);
  ctx.stroke();
  ctx.shadowBlur=0;
}

function renderOtherworld(){
  if(otherworldType==='lava'){
    let grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#3a0a00');
    grd.addColorStop(0.5,'#5a1500');
    grd.addColorStop(1,'#2a0800');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);
    // Volcano silhouettes
    ctx.fillStyle='#1a0500';
    ctx.beginPath();
    ctx.moveTo(600,GROUND_Y+player.h);ctx.lineTo(650,200);ctx.lineTo(700,GROUND_Y+player.h);ctx.fill();
    ctx.beginPath();
    ctx.moveTo(100,GROUND_Y+player.h);ctx.lineTo(140,250);ctx.lineTo(180,GROUND_Y+player.h);ctx.fill();
    // Ground
    ctx.fillStyle='#1a1010';
    ctx.fillRect(0,GROUND_Y+player.h,W,H-GROUND_Y-player.h);
    ctx.strokeStyle='#f60';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,GROUND_Y+player.h);ctx.lineTo(W,GROUND_Y+player.h);ctx.stroke();
  }else{
    let grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'#1a1a2e');
    grd.addColorStop(1,'#2a2a3e');
    ctx.fillStyle=grd;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3a3a4a';
    ctx.fillRect(0,GROUND_Y+player.h,W,H-GROUND_Y-player.h);
    ctx.strokeStyle='#666';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,GROUND_Y+player.h);ctx.lineTo(W,GROUND_Y+player.h);ctx.stroke();
  }
}

function renderPlayer(){
  let px=player.x,py=player.y;
  // Body color based on buff
  let bodyColor='#4af';
  if(buffs.rocket>0)bodyColor='#f60';
  else if(buffs.jetpack>0)bodyColor='#8f4';
  else if(buffs.shoes>0)bodyColor='#ff0';
  else if(buffs.shield>0)bodyColor='#4ff';

  // Shield aura
  if(buffs.shield>0){
    let pulse=Math.sin(frameCount*0.1)*3;
    ctx.strokeStyle='rgba(80,180,255,0.5)';
    ctx.lineWidth=2+pulse*0.3;
    ctx.beginPath();
    ctx.ellipse(px+player.w/2,py+player.h/2,player.w+8+pulse,player.h+4+pulse,0,0,Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle='rgba(80,180,255,0.2)';
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.ellipse(px+player.w/2,py+player.h/2,player.w+12+pulse,player.h+8+pulse,0,0,Math.PI*2);
    ctx.stroke();
  }

  // Body
  ctx.fillStyle=bodyColor;
  ctx.shadowColor=bodyColor;ctx.shadowBlur=8;

  // Running animation
  let legOffset=Math.sin(player.frame*Math.PI/2)*5;
  // Torso
  ctx.beginPath();
  ctx.roundRect(px+5,py+2,20,22,4);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.arc(px+15,py-4,8,0,Math.PI*2);
  ctx.fill();
  // Legs
  ctx.fillRect(px+7,py+24,7,16+legOffset);
  ctx.fillRect(px+17,py+24,7,16-legOffset);
  // Arms
  let armSwing=Math.sin(player.frame*Math.PI/2)*8;
  ctx.fillRect(px+1,py+5,5,14+armSwing*0.3);
  ctx.fillRect(px+25,py+5,5,14-armSwing*0.3);

  ctx.shadowBlur=0;

  // Bow on hand
  if(buffs.bow>0){
    ctx.strokeStyle='#a52';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(px+32,py+10,10,Math.PI*0.3,Math.PI*1.7);
    ctx.stroke();
    ctx.strokeStyle='#ffd700';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(px+34,py+2);ctx.lineTo(px+34,py+18);
    ctx.stroke();
  }

  // Flying effect
  if(isFlying){
    ctx.fillStyle='rgba(255,200,0,0.4)';
    for(let i=0;i<3;i++){
      let fy=py+player.h+5+i*6;
      let fw=8-i*2;
      ctx.beginPath();
      ctx.arc(px+player.w/2+Math.sin(frameCount*0.3+i)*3,fy,fw,0,Math.PI*2);
      ctx.fill();
    }
  }
}

function renderObstacle(o){
  ctx.fillStyle=o.color;
  ctx.shadowColor=o.color;ctx.shadowBlur=6;
  if(o.type==='spike'){
    ctx.beginPath();
    ctx.moveTo(o.x,o.y+o.h);
    ctx.lineTo(o.x+o.w/2,o.y);
    ctx.lineTo(o.x+o.w,o.y+o.h);
    ctx.closePath();
    ctx.fill();
  }else if(o.type==='block'){
    ctx.beginPath();
    ctx.roundRect(o.x,o.y,o.w,o.h,4);
    ctx.fill();
  }else{
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.fillRect(o.x+2,o.y+2,o.w-4,6);
  }
  ctx.shadowBlur=0;
}

function renderOWObstacle(o){
  if(o.type==='lava'){
    ctx.fillStyle='#f40';
    ctx.shadowColor='#f80';ctx.shadowBlur=10;
    ctx.beginPath();
    ctx.roundRect(o.x,o.y,o.w,o.h,4);
    ctx.fill();
    // Bubbles
    ctx.fillStyle='#fa0';
    let bt=o.bubbleT||0;
    for(let i=0;i<3;i++){
      let bx=o.x+10+i*18;
      let by=o.y-4-Math.abs(Math.sin(bt*0.08+i))*8;
      ctx.beginPath();ctx.arc(bx,by,3,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;
  }else{
    // Metal spike
    ctx.fillStyle='#888';
    ctx.shadowColor='#aaa';ctx.shadowBlur=4;
    ctx.beginPath();
    ctx.moveTo(o.x,o.y+o.h);
    ctx.lineTo(o.x+o.w/2,o.y);
    ctx.lineTo(o.x+o.w,o.y+o.h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#bbb';
    ctx.beginPath();
    ctx.moveTo(o.x+5,o.y+o.h);
    ctx.lineTo(o.x+o.w/2,o.y+5);
    ctx.lineTo(o.x+o.w/2,o.y+o.h);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur=0;
  }
}

function renderChest(c){
  if(c.purple){
    ctx.fillStyle='#5a1a8a';
    ctx.shadowColor='#a040f0';ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.roundRect(c.x,c.y,c.w,c.h,5);
    ctx.fill();
    ctx.fillStyle='#f44';
    ctx.font='bold 14px Noto Sans SC';
    ctx.textAlign='center';
    ctx.fillText('✕',c.x+c.w/2,c.y+c.h/2+5);
  }else{
    ctx.fillStyle='#d4a520';
    ctx.shadowColor='#ffd700';ctx.shadowBlur=8;
    ctx.beginPath();
    ctx.roundRect(c.x,c.y,c.w,c.h,5);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px Noto Sans SC';
    ctx.textAlign='center';
    ctx.fillText('?',c.x+c.w/2,c.y+c.h/2+5);
  }
  ctx.shadowBlur=0;
  ctx.textAlign='left';
}

})();
</script>
