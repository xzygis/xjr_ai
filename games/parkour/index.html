<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限跑酷游戏 (Parkour Runner)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="ui-layer">
            <div id="score-display">分数: <span id="score">0</span></div>
            <div id="game-over" class="hidden">
                <h2>游戏结束</h2>
                <p>最终得分: <span id="final-score">0</span></p>
                <p>按 <strong>Enter 键</strong> 重新开始</p>
                <button id="restart-btn">重新开始</button>
            </div>
            <div id="start-screen">
                <h2>无限跑酷游戏</h2>
                <p>按 <strong>空格键</strong>、<strong>向上方向键</strong>、<strong>Q 键</strong>、<strong>O 键</strong> 或 <strong>数字 1 键</strong> 跳跃</p>
                <p>按 <strong>Enter 键</strong> 开始游戏或重新开始</p>
                <button id="start-btn">开始游戏</button>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
