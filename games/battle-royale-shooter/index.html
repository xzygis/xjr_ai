<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>枪战吃鸡战场</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #1f2f2d 0%, #121919 55%, #0b1010 100%);
      color: #e8f6ef;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .game-shell {
      width: min(1280px, 100%);
      background: rgba(14, 24, 23, 0.82);
      border: 1px solid rgba(105, 146, 127, 0.35);
      border-radius: 16px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .hud {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px 14px;
      background: linear-gradient(90deg, rgba(34, 64, 54, 0.68), rgba(20, 44, 40, 0.72));
      border-bottom: 1px solid rgba(106, 166, 136, 0.25);
    }
    .hud-left {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .chip {
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(171, 219, 191, 0.12);
      border: 1px solid rgba(172, 224, 192, 0.22);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .hud-right {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .buy-btn {
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #e6fff5;
      background: linear-gradient(135deg, #1f7d60, #166349);
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .buy-btn:hover { transform: translateY(-1px); }
    .buy-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      background: #111;
    }
    canvas {
      display: block;
      width: min(1280px, 100%);
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at 40% 30%, #2a483a, #1d342b 54%, #16261f 100%);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .card {
      width: min(560px, calc(100% - 40px));
      padding: 20px;
      border-radius: 14px;
      background: rgba(11, 19, 18, 0.86);
      border: 1px solid rgba(116, 179, 143, 0.3);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.4);
      text-align: center;
      pointer-events: auto;
    }
    .card h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .card p {
      margin: 0 0 10px;
      color: #b9d9cb;
      font-size: 14px;
      line-height: 1.55;
    }
    .card button {
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      background: linear-gradient(135deg, #2fa17d, #228666);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .tips {
      padding: 10px 14px 14px;
      font-size: 12px;
      color: #9ac3b0;
      background: rgba(16, 31, 27, 0.82);
      border-top: 1px solid rgba(112, 171, 144, 0.18);
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="hud">
      <div class="hud-left">
bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb        <div class="chip" id="hpChip">生命 100</div>
        <div class="chip" id="surviveChip">生存 0.0 秒</div>
        <div class="chip" id="weaponChip">武器: 火箭发射器</div>
        <div class="chip" id="nukeChip">核弹(6): 准备就绪</div>
        <div class="chip" id="hBombChip">氢弹(7): 准备就绪</div>
      </div>
    </section>
    <section class="stage">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
      <div class="overlay" id="overlay">
        <div class="card" id="panel">
          <h1>枪战吃鸡战场</h1>
          <p>WASD移动，鼠标瞄准，左键/P键自动射击，B召唤小兵。</p>
          <p>按 1-5 切换武器: 1手枪 2冲锋枪 3狙击枪 4火箭 5突击步枪</p>
          <p>按 6 发射核弹(10s冷却，消灭一半敌人)，按 7 发射氢弹(30s冷却，全屏秒杀)。</p>
          <button id="startBtn">开始战斗</button>
        </div>
      </div>
    </section>
    <section class="tips" id="msgLine">提示：数字键1-7切换武器，B键在基地召唤无敌小兵。</section>
  </main>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const hpChip = document.getElementById("hpChip");
    const surviveChip = document.getElementById("surviveChip");
    const weaponChip = document.getElementById("weaponChip");
    const nukeChip = document.getElementById("nukeChip");
    const hBombChip = document.getElementById("hBombChip");
    const msgLine = document.getElementById("msgLine");
    const overlay = document.getElementById("overlay");
    const panel = document.getElementById("panel");
    const startBtn = document.getElementById("startBtn");

    // Web Audio API Sound System
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'buy') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'spawn') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    const W = 1280;
    const H = 720;
    const keys = {};
    const mouse = { x: W / 2, y: H / 2, down: false };

    const state = {
      running: false,
      player: null,
      enemies: [],
      minions: [],
      giantMinion: null, // Track giant minion
      bullets: [],
      enemyBullets: [],
      particles: [],
      obstacles: [],
      survival: 0,
      enemySpawnTimer: 0,
      messageTimer: 0,
      autoFire: false,
      currentWeapon: 4, // 1: Pistol, 2: SMG, 3: Sniper, 4: Rocket, 5: Assault Rifle
      nukeCooldown: 0,  // Weapon 6
      hBombCooldown: 0  // Weapon 7
    };

    const WEAPON_NAMES = {
      1: "手枪",
      2: "冲锋枪",
      3: "狙击枪",
      4: "火箭发射器",
      5: "突击步枪"
    };

    function renderHomePanel(title = "枪战吃鸡战场", subtitle = "WASD移动，鼠标瞄准，左键/P键自动射击，B召唤无敌小兵。") {
      overlay.style.display = "flex";
      panel.innerHTML = `
        <h1>${title}</h1>
        <p>${subtitle}</p>
        <p>按 1-5 切换武器，6/7发射大杀器，一直召唤小兵可合体！</p>
        <button id="startBtn">开始战斗</button>
      `;
      document.getElementById("startBtn").addEventListener("click", resetGame);
    }

    function setMessage(text) {
      msgLine.textContent = text;
      state.messageTimer = 2.8;
    }

    function createObstacles() {
      return [
        { x: 250, y: 130, w: 150, h: 90 },
        { x: 520, y: 84, w: 240, h: 72 },
        { x: 860, y: 180, w: 170, h: 80 },
        { x: 180, y: 340, w: 220, h: 74 },
        { x: 500, y: 300, w: 220, h: 130 },
        { x: 890, y: 360, w: 220, h: 80 },
        { x: 290, y: 540, w: 200, h: 90 },
        { x: 760, y: 560, w: 250, h: 80 }
      ];
    }

    // 基地框框的位置和大小
    const baseBox = { x: W / 2 - 100, y: H / 2 - 100, w: 200, h: 200 };

    function resetGame() {
      state.running = true;
      state.player = {
        x: W / 2,
        y: H / 2,
        r: 16,
        speed: 240,
        hp: 100,
        shootCd: 0,
        springCd: 0,
        flyingTimer: state.pendingFlyTime,
        jetpackTimer: state.pendingJetTime,
        rocketOn: state.rocketOwned
      };
      state.pendingFlyTime = 0;
      state.pendingJetTime = 0;
      state.enemies = [];
      state.minions = [];
      state.giantMinion = null;
      state.bullets = [];
      state.enemyBullets = [];
      state.particles = [];
      state.obstacles = createObstacles();
      state.survival = 0;
      state.coinTick = 0;
      state.enemySpawnTimer = 0.8;
      state.nukeCooldown = 0;
      state.hBombCooldown = 0;
      state.messageTimer = 0;
      overlay.style.display = "none";
      updateHud();
      setMessage("战斗开始：每生存1秒获得1积分，每30秒获得1金币。");
    }

    function stopGame() {
      state.running = false;
      playSound('gameover');
      renderHomePanel("你被淘汰了", `本局生存 ${state.survival.toFixed(1)} 秒。你已返回主页，可继续购买后再开局。`);
    }

    function addParticle(x, y, color, size = 2, life = 0.4) {
      state.particles.push({
        x, y, color, size, life,
        vx: (Math.random() - 0.5) * 160,
        vy: (Math.random() - 0.5) * 160
      });
    }

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x = 0;
      let y = 0;
      if (side === 0) { x = -30; y = Math.random() * H; }
      if (side === 1) { x = W + 30; y = Math.random() * H; }
      if (side === 2) { x = Math.random() * W; y = -30; }
      if (side === 3) { x = Math.random() * W; y = H + 30; }
      state.enemies.push({
        x, y, r: 15, hp: 60, speed: 120 + Math.random() * 35, fireCd: 0.5 + Math.random() * 0.9
      });
    }

    function isInsideObstacle(x, y, r = 0) {
      for (const o of state.obstacles) {
        const nearX = Math.max(o.x, Math.min(x, o.x + o.w));
        const nearY = Math.max(o.y, Math.min(y, o.y + o.h));
        const dx = x - nearX;
        const dy = y - nearY;
        if (dx * dx + dy * dy <= r * r) return true;
      }
      return false;
    }

    function moveWithObstacle(entity, nx, ny, canPhase) {
      if (canPhase) {
        entity.x = nx;
        entity.y = ny;
        return;
      }
      if (!isInsideObstacle(nx, entity.y, entity.r)) entity.x = nx;
      if (!isInsideObstacle(entity.x, ny, entity.r)) entity.y = ny;
    }

    function canPlayerPhase() {
      return state.player.flyingTimer > 0 || state.player.jetpackTimer > 0 || state.player.rocketOn;
    }

    function buySpringAction() {
      if (state.coins < 30) return setMessage("金币不足：弹跳弹簧需要30金币。");
      state.coins -= 30;
      state.springCharges += 1;
      playSound('buy');
      updateHud();
      setMessage("购买成功：获得1次弹跳弹簧（按Q触发）。");
    }

    function buyFlyAction() {
      if (state.coins < 100) return setMessage("金币不足：飞行装置需要100金币。");
      state.coins -= 100;
      playSound('buy');
      if (state.running) state.player.flyingTimer = Math.max(state.player.flyingTimer, 5);
      else state.pendingFlyTime += 5;
      updateHud();
      setMessage("飞行装置已购买：可飞行5秒。");
    }

    function buyJetAction() {
      if (state.score < 200) return setMessage("积分不足：喷气背包需要200积分。");
      state.score -= 200;
      playSound('buy');
      if (state.running) state.player.jetpackTimer = Math.max(state.player.jetpackTimer, 15);
      else state.pendingJetTime += 15;
      updateHud();
      setMessage("喷气背包已购买：可持续15秒。");
    }

    function buyRocketAction() {
      if (state.rocketOwned) return setMessage("火箭已解锁：可永久飞行穿障。");
      if (state.score < 1000) return setMessage("积分不足：火箭需要1000积分。");
      state.score -= 1000;
      state.rocketOwned = true;
      playSound('buy');
      if (state.running) state.player.rocketOn = true;
      updateHud();
      setMessage("火箭解锁成功：永久飞行并穿越障碍。");
    }

    function updateHud() {
      hpChip.textContent = `生命 ${Math.max(0, Math.floor(state.player ? state.player.hp : 0))}`;
      surviveChip.textContent = `生存 ${state.survival.toFixed(1)} 秒`;
      weaponChip.textContent = `武器: ${WEAPON_NAMES[state.currentWeapon]}`;
      
      if (state.nukeCooldown <= 0) {
        nukeChip.textContent = "核弹(6): 准备就绪";
        nukeChip.style.color = "#ff4757";
      } else {
        nukeChip.textContent = `核弹(6): ${state.nukeCooldown.toFixed(1)}s`;
        nukeChip.style.color = "#747d8c";
      }
      
      if (state.hBombCooldown <= 0) {
        hBombChip.textContent = "氢弹(7): 准备就绪";
        hBombChip.style.color = "#ff4757";
      } else {
        hBombChip.textContent = `氢弹(7): ${state.hBombCooldown.toFixed(1)}s`;
        hBombChip.style.color = "#747d8c";
      }
    }

    function getWeaponStats(weaponType) {
      let speed, damage, radius, cooldown, color, spread = 0, bulletsToFire = 1;
      switch(weaponType) {
        case 1: // 手枪
          speed = 500; damage = 20; radius = 4; cooldown = 0.4; color = "#f1c40f"; break;
        case 2: // 冲锋枪
          speed = 600; damage = 12; radius = 3; cooldown = 0.1; color = "#e67e22"; spread = 0.15; break;
        case 3: // 狙击枪
          speed = 1200; damage = 100; radius = 5; cooldown = 1.2; color = "#3498db"; break;
        case 4: // 火箭发射器
          speed = 400; damage = 150; radius = 8; cooldown = 1.0; color = "#e74c3c"; break;
        case 5: // 突击步枪
          speed = 700; damage = 25; radius = 4; cooldown = 0.2; color = "#2ecc71"; spread = 0.05; break;
        default:
          speed = 610; damage = 24; radius = 4; cooldown = 0.16; color = "#9be7d0";
      }
      return { speed, damage, radius, cooldown, color, spread, bulletsToFire };
    }

    function firePlayerBullet() {
      const p = state.player;
      if (p.shootCd > 0) return;
      const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      
      const stats = getWeaponStats(state.currentWeapon);
      p.shootCd = stats.cooldown;
      
      for (let i = 0; i < stats.bulletsToFire; i++) {
        const finalAngle = angle + (Math.random() - 0.5) * stats.spread;
        state.bullets.push({
          x: p.x + Math.cos(finalAngle) * 22,
          y: p.y + Math.sin(finalAngle) * 22,
          vx: Math.cos(finalAngle) * stats.speed,
          vy: Math.sin(finalAngle) * stats.speed,
          damage: stats.damage,
          radius: stats.radius,
          phase: true, // 子弹始终可以穿墙
          isPlayerBullet: true,
          isExplosive: state.currentWeapon === 4 // 火箭发射器特有属性
        });
      }
      
      playSound('shoot');
      for (let i = 0; i < 4; i++) addParticle(p.x, p.y, stats.color, 2.2, 0.24);
    }

    function activateSpring() {
      const p = state.player;
      if (state.springCharges < 1 || p.springCd > 0) return;
      state.springCharges -= 1;
      p.springCd = 0.85;
      const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      p.x += Math.cos(angle) * 220;
      p.y += Math.sin(angle) * 220;
      p.x = Math.max(p.r, Math.min(W - p.r, p.x));
      p.y = Math.max(p.r, Math.min(H - p.r, p.y));
      for (let i = 0; i < 16; i++) addParticle(p.x, p.y, "#b4ff4f", 2.6, 0.5);
      setMessage("弹跳触发：快速位移完成。");
    }

    function updatePlayer(dt) {
      const p = state.player;
      let dx = 0;
      let dy = 0;
      if (keys["w"]) dy -= 1;
      if (keys["s"]) dy += 1;
      if (keys["a"]) dx -= 1;
      if (keys["d"]) dx += 1;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len;
      dy /= len;

      const speedMul = p.jetpackTimer > 0 ? 1.65 : p.flyingTimer > 0 ? 1.3 : 1;
      const nx = p.x + dx * p.speed * speedMul * dt;
      const ny = p.y + dy * p.speed * speedMul * dt;
      moveWithObstacle(p, nx, ny, canPlayerPhase());

      p.x = Math.max(p.r, Math.min(W - p.r, p.x));
      p.y = Math.max(p.r, Math.min(H - p.r, p.y));

      p.shootCd = Math.max(0, p.shootCd - dt);
      p.springCd = Math.max(0, p.springCd - dt);
      p.flyingTimer = Math.max(0, p.flyingTimer - dt);
      p.jetpackTimer = Math.max(0, p.jetpackTimer - dt);

      // 自动开火或按下鼠标时发射子弹，始终朝向鼠标当前位置
      if (mouse.down || state.autoFire) firePlayerBullet();
      if (keys[" "]) {
        const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
        p.x += Math.cos(angle) * 180 * dt;
        p.y += Math.sin(angle) * 180 * dt;
      }
      if (keys["6"]) {
        keys["6"] = false;
        fireNuke();
      }
      if (keys["7"]) {
        keys["7"] = false;
        fireHBomb();
      }

      if (keys["p"]) {
        keys["p"] = false;
        state.autoFire = !state.autoFire;
        setMessage(state.autoFire ? "自动开火：已开启" : "自动开火：已关闭");
      }

      if (keys["b"]) {
        keys["b"] = false;
        spawnMinion();
      }

      if (keys["1"]) state.currentWeapon = 1;
      if (keys["2"]) state.currentWeapon = 2;
      if (keys["3"]) state.currentWeapon = 3;
      if (keys["4"]) state.currentWeapon = 4;
      if (keys["5"]) state.currentWeapon = 5;
    }

    function fireNuke() {
      if (state.nukeCooldown > 0) return;
      state.nukeCooldown = 5; // Reduced to 5 seconds
      playSound('buy'); // Use buy sound as a generic 'special' sound
      
      // Kill half the enemies
      const killCount = Math.floor(state.enemies.length / 2);
      for (let i = 0; i < killCount; i++) {
        if (state.enemies[i]) {
          state.enemies[i].hp = 0;
          state.enemies[i].dead = true;
          for (let j = 0; j < 10; j++) addParticle(state.enemies[i].x, state.enemies[i].y, "#ff9f43", 4, 0.5);
        }
      }
      setMessage("核弹发射！消灭了一半的敌人。");
    }

    function fireHBomb() {
      if (state.hBombCooldown > 0) return;
      state.hBombCooldown = 5; // Reduced to 5 seconds
      playSound('buy');
      
      // Kill all enemies
      for (const e of state.enemies) {
        if (e.dead) continue;
        e.hp = 0;
        e.dead = true;
        for (let j = 0; j < 10; j++) addParticle(e.x, e.y, "#ff4757", 5, 0.6);
      }
      
      setMessage("氢弹发射！全屏敌人被秒杀。");
    }

    function spawnMinionAt(x, y) {
      // 增加转换视觉效果：金光爆发，然后变成蓝色小兵
      for (let i = 0; i < 15; i++) {
        addParticle(x, y, "#f1c40f", 4, 0.5); // 金色
        addParticle(x, y, "#3498db", 3, 0.4); // 蓝色
      }
      
      state.minions.push({
        x: x,
        y: y,
        r: 12,
        speed: 150,
        hp: Infinity, // 无敌
        fireCd: 0.5,
        type: 'normal' // 普通小兵
      });
      checkGiantMinionMerge();
    }

    function spawnMinion() {
      // 召唤小兵，无敌且在基地框框内生成
      const spawnX = baseBox.x + Math.random() * baseBox.w;
      const spawnY = baseBox.y + Math.random() * baseBox.h;
      
      state.minions.push({
        x: spawnX,
        y: spawnY,
        r: 12,
        speed: 150,
        hp: Infinity, // 无敌
        fireCd: 0.5,
        type: 'normal' // 普通小兵
      });
      
      playSound('spawn');
      
      // 检查是否可以合并成巨型小兵
      checkGiantMinionMerge();
    }

    function checkGiantMinionMerge() {
      // 假设当基地内普通小兵数量达到 10000 个时，融合成一个巨型小兵
      const normalMinions = state.minions.filter(m => m.type === 'normal');
      if (normalMinions.length >= 10000) {
        // 移除这 10000 个普通小兵
        let removed = 0;
        state.minions = state.minions.filter(m => {
          if (m.type === 'normal' && removed < 10000) {
            removed++;
            return false; // remove
          }
          return true; // keep
        });
        
        // 生成新的巨型小兵，位置随机在地图其他地方，不在基地框内
        let giantX = Math.random() * W;
        let giantY = Math.random() * H;
        
        // 简单确保它不在基地框内出生
        while (giantX > baseBox.x && giantX < baseBox.x + baseBox.w && 
               giantY > baseBox.y && giantY < baseBox.y + baseBox.h) {
          giantX = Math.random() * W;
          giantY = Math.random() * H;
        }

        const newGiant = {
          x: giantX,
          y: giantY,
          r: 40,
          speed: 80, // 移动慢一点
          hp: Infinity,
          fireCd: 1.0,
          type: 'giant',
          // 巨型小兵的巡逻目标点
          targetX: Math.random() * W,
          targetY: Math.random() * H
        };
        state.minions.push(newGiant);
        playSound('buy'); // 播放融合音效
        setMessage("一万名小兵集结，融合成巨型小兵并前往外部战场！");
      } else {
        setMessage(`已召唤小兵！(${normalMinions.length}/10000)`);
      }
    }

    function updateEnemies(dt) {
      const p = state.player;
      for (const e of state.enemies) {
        const angle = Math.atan2(p.y - e.y, p.x - e.x);
        const nx = e.x + Math.cos(angle) * e.speed * dt;
        const ny = e.y + Math.sin(angle) * e.speed * dt;
        moveWithObstacle(e, nx, ny, false);
        e.fireCd -= dt;
        if (e.fireCd <= 0) {
          e.fireCd = 1.15 + Math.random() * 0.85;
          const spread = (Math.random() - 0.5) * 0.26;
          const a = angle + spread;
          state.enemyBullets.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(a) * 330,
            vy: Math.sin(a) * 330,
            damage: 12,
            radius: 4
          });
        }
      }
    }

    function updateMinions(dt) {
      for (const m of state.minions) {
        // All minions aim at the mouse cursor
        const angle = Math.atan2(mouse.y - m.y, mouse.x - m.x);
        
        if (m.type === 'giant') {
          // Giant minion logic: move to target point
          const dToTarget = Math.hypot(m.targetX - m.x, m.targetY - m.y);
          if (dToTarget < 10) {
            // Pick new target outside base box
            m.targetX = Math.random() * W;
            m.targetY = Math.random() * H;
          } else {
            const moveAngle = Math.atan2(m.targetY - m.y, m.targetX - m.x);
            const nx = m.x + Math.cos(moveAngle) * m.speed * dt;
            const ny = m.y + Math.sin(moveAngle) * m.speed * dt;
            moveWithObstacle(m, nx, ny, false);
          }
          
          // Fire at closest enemy (Hydrogen Bomb)
          m.fireCd -= dt;
          if (m.fireCd <= 0 && state.enemies.length > 0) { // Only fire if enemies exist
            // Find closest enemy
            let closestEnemy = null;
            let minDist = Infinity;
            for (const e of state.enemies) {
              const d = Math.hypot(e.x - m.x, e.y - m.y);
              if (d < minDist) {
                minDist = d;
                closestEnemy = e;
              }
            }

            if (closestEnemy) {
              // Minions fire a Hydrogen Bomb equivalent
              m.fireCd = 5.0; // Give it a 5-second cooldown like the player's H-Bomb so it doesn't instantly wipe the screen every frame
              playSound('buy'); // Play explosion sound
              
              // Visual indicator of minion firing H-Bomb
              for (let i = 0; i < 8; i++) addParticle(m.x, m.y, "#ff4757", 4, 0.4);
              
              // Kill all enemies on screen (H-Bomb effect)
              for (const e of state.enemies) {
                if (e.dead) continue;
                e.hp = 0;
                e.dead = true;
                for (let j = 0; j < 10; j++) addParticle(e.x, e.y, "#ff4757", 5, 0.6);
                
                // Convert killed enemy to minion
                spawnMinionAt(e.x, e.y);
              }
            }
          }
          
        } else {
          // Normal minion logic
          if (state.enemies.length === 0) continue;
          
          // Find closest enemy just for movement logic
          let closestEnemy = null;
          let minDist = Infinity;
          for (const e of state.enemies) {
            const d = Math.hypot(e.x - m.x, e.y - m.y);
            if (d < minDist) {
              minDist = d;
              closestEnemy = e;
            }
          }
          
          if (closestEnemy) {
            const moveAngle = Math.atan2(closestEnemy.y - m.y, closestEnemy.x - m.x);
            // Move towards enemy if too far, stop if close enough
            if (minDist > 100) {
              const nx = m.x + Math.cos(moveAngle) * m.speed * dt;
              const ny = m.y + Math.sin(moveAngle) * m.speed * dt;
              moveWithObstacle(m, nx, ny, false);
            }
          }
          
          // Fire at closest enemy (Hydrogen Bomb)
          m.fireCd -= dt;
          if (m.fireCd <= 0 && closestEnemy) {
            m.fireCd = 5.0; // 5 seconds cooldown
            playSound('buy'); // Explosion sound
            
            for (let i = 0; i < 8; i++) addParticle(m.x, m.y, "#ff4757", 4, 0.4);
            
            // Kill all enemies on screen
            for (const e of state.enemies) {
              if (e.dead) continue;
              e.hp = 0;
              e.dead = true;
              for (let j = 0; j < 10; j++) addParticle(e.x, e.y, "#ff4757", 5, 0.6);
            }
          }
        }
      }
    }

    function updateBullets(dt) {
      const p = state.player;
      for (const b of state.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (!b.phase && isInsideObstacle(b.x, b.y, b.radius)) b.dead = true;
        for (const e of state.enemies) {
          if (e.dead) continue;
          const d = Math.hypot(b.x - e.x, b.y - e.y);
          if (d <= b.radius + e.r) {
            e.hp -= b.damage;
            if (!b.phase) b.dead = true;
            
            // 爆炸武器特效
            if (b.isExplosive) {
              for (let i = 0; i < 15; i++) addParticle(b.x, b.y, "#e74c3c", 4, 0.4);
              playSound('buy'); // Use buy sound as explosion
              // 范围伤害
              for (const other of state.enemies) {
                if (other === e || other.dead) continue;
                if (Math.hypot(b.x - other.x, b.y - other.y) < 60) {
                  other.hp -= b.damage * 0.5;
                  if (other.hp <= 0) {
                    other.dead = true;
                    for (let i = 0; i < 12; i++) addParticle(other.x, other.y, "#ffc26e", 3, 0.6);
                  }
                }
              }
            } else {
              addParticle(e.x, e.y, "#ff7b74", 3, 0.35);
            }
            
            if (e.hp <= 0) {
              e.dead = true;
              for (let i = 0; i < 12; i++) addParticle(e.x, e.y, "#ffc26e", 3, 0.6);
            }
          }
        }
        if (b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) b.dead = true;
      }
      state.bullets = state.bullets.filter(b => !b.dead);

      for (const b of state.enemyBullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (isInsideObstacle(b.x, b.y, b.radius) && !canPlayerPhase()) b.dead = true;
        const d = Math.hypot(b.x - p.x, b.y - p.y);
          if (d <= b.radius + p.r) {
            b.dead = true;
            if (!p.rocketOn) {
              p.hp -= b.damage;
              playSound('hit');
            }
            for (let i = 0; i < 6; i++) addParticle(p.x, p.y, "#ff8f89", 2.4, 0.3);
          }
          if (b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) b.dead = true;
        }
        state.enemyBullets = state.enemyBullets.filter(b => !b.dead);

        // Check enemy bullets hitting minions
        for (const b of state.enemyBullets) {
          for (const m of state.minions) {
            if (m.dead || m.hp === Infinity) continue;
            const d = Math.hypot(b.x - m.x, b.y - m.y);
            if (d <= b.radius + m.r) {
              b.dead = true;
              m.hp -= b.damage;
              playSound('hit');
              for (let i = 0; i < 4; i++) addParticle(m.x, m.y, "#8ce6ff", 2, 0.2);
              if (m.hp <= 0) {
                m.dead = true;
                for (let i = 0; i < 8; i++) addParticle(m.x, m.y, "#56c4fa", 3, 0.4);
              }
            }
          }
        }
      state.minions = state.minions.filter(m => !m.dead);
    }

    function updateParticles(dt) {
      for (const p of state.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      }
      state.particles = state.particles.filter(p => p.life > 0);
    }

    function updateEconomy(dt) {
      state.survival += dt;
      // 移除经济系统，无需处理金币和积分
    }

    function drawGround() {
      ctx.clearRect(0, 0, W, H);
      for (let x = 0; x < W; x += 64) {
        ctx.strokeStyle = "rgba(146, 195, 166, 0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 64) {
        ctx.strokeStyle = "rgba(146, 195, 166, 0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
      
      // 绘制基地框框
      ctx.strokeStyle = "rgba(52, 152, 219, 0.3)";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.strokeRect(baseBox.x, baseBox.y, baseBox.w, baseBox.h);
      ctx.setLineDash([]);
      
      for (const o of state.obstacles) {
        ctx.fillStyle = "rgba(80, 100, 92, 0.95)";
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = "rgba(184, 223, 202, 0.32)";
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      }
    }

    function drawEntities() {
      for (const b of state.bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.phase ? "#ffb449" : "#8ff6dd";
        ctx.fill();
      }
      for (const b of state.enemyBullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ff6d66";
        ctx.fill();
      }
      for (const e of state.enemies) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fillStyle = "#d45d5d";
        ctx.fill();
        ctx.strokeStyle = "#ffaea8";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      for (const m of state.minions) {
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fillStyle = "#3498db"; // Blue minion
        ctx.fill();
        ctx.strokeStyle = "#8ce6ff";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Draw minion health bar
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(m.x - 10, m.y - 18, 20, 4);
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(m.x - 10, m.y - 18, 20 * (m.hp / 40), 4);
      }
      const p = state.player;
      const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.rocketOn ? "#f09d3f" : p.jetpackTimer > 0 ? "#56c4fa" : p.flyingTimer > 0 ? "#8ce6ff" : "#50e0a6";
      ctx.fill();
      ctx.beginPath();
      ctx.rect(0, -4, 22, 8);
      ctx.fillStyle = "#d6e8e0";
      ctx.fill();
      ctx.restore();

      if (p.flyingTimer > 0 || p.jetpackTimer > 0 || p.rocketOn) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 7 + Math.sin(performance.now() / 120) * 2, 0, Math.PI * 2);
        ctx.strokeStyle = p.rocketOn ? "rgba(255,157,70,0.7)" : "rgba(124,227,255,0.6)";
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      for (const t of state.particles) {
        ctx.globalAlpha = Math.max(0, t.life * 1.9);
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
        ctx.fillStyle = t.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (state.running) {
        updatePlayer(dt);
        updateMinions(dt);
        updateEnemies(dt);
        updateBullets(dt);
        updateParticles(dt);
        updateEconomy(dt);
        // Dynamic spawning based on minion count
        // Enemy count must be at least minion count + 1
        const targetEnemyCount = Math.max(state.minions.length + 1, 5); // Ensure there are always at least 5 enemies
        
        state.enemySpawnTimer -= dt;
        if (state.enemySpawnTimer <= 0) {
          state.enemySpawnTimer = 0.5; // check frequently
          if (state.enemies.length < targetEnemyCount) {
            spawnEnemy();
          }
        }
        state.enemies = state.enemies.filter(e => !e.dead);

        // Handle cooldowns
        if (state.nukeCooldown > 0) state.nukeCooldown -= dt;
        if (state.hBombCooldown > 0) state.hBombCooldown -= dt;

        if (state.player.hp <= 0) stopGame();
        if (state.messageTimer > 0) {
          state.messageTimer -= dt;
        } else if (state.running) {
          msgLine.textContent = "提示：Q是弹簧位移，空格冲刺，P切换自动开火，B免费召唤小兵。";
        }
        updateHud();
      }
      drawGround();
      if (state.player) drawEntities();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === " ") e.preventDefault();
    });
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
      mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    });
    canvas.addEventListener("mousedown", () => mouse.down = true);
    window.addEventListener("mouseup", () => mouse.down = false);

    startBtn.addEventListener("click", resetGame);
    buySpring.addEventListener("click", buySpringAction);
    buyFly.addEventListener("click", buyFlyAction);
    buyJet.addEventListener("click", buyJetAction);
    buyRocket.addEventListener("click", buyRocketAction);
    renderHomePanel();
    updateHud();
  </script>
</body>
</html>
