<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Circular Arena Shooter</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; z-index: 10;
        }
        #menu h1 { font-size: 48px; margin-bottom: 10px; color: #ff5555; }
        #menu p { font-size: 20px; margin: 5px 0; }
        #play-btn {
            margin-top: 30px; padding: 15px 40px; font-size: 24px;
            background: #ff5555; color: white; border: none;
            border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        #play-btn:hover { background: #ff3333; transform: scale(1.05); }
        
        #hud { display: none; pointer-events: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        .ch-line { position: absolute; background: rgba(255,255,255,0.8); }
        .ch-h { width: 100%; height: 2px; top: 9px; left: 0; }
        .ch-v { width: 2px; height: 100%; top: 0; left: 9px; }
        
        #hit-marker {
            position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
            transform: translate(-50%, -50%) rotate(45deg);
            pointer-events: none; opacity: 0; transition: opacity 0.1s;
        }
        .hm-line { position: absolute; background: red; }
        .hm-h { width: 100%; height: 2px; top: 14px; left: 0; }
        .hm-v { width: 2px; height: 100%; top: 0; left: 14px; }

        #stats {
            position: absolute; bottom: 30px; left: 30px;
            color: white; font-size: 24px; text-shadow: 2px 2px 0 #000;
        }
        #stats div { margin-bottom: 5px; }
        
        #score-container {
            position: absolute; top: 30px; right: 30px;
            color: #ffaa00; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 0 #000;
        }
        
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.3) 100%);
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        
        #sniper-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, black 70%);
            display: none; pointer-events: none;
        }
        #sniper-overlay::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,0,0,0.5);
        }
        #sniper-overlay::before {
            content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>3D 立体圆形竞技场</h1>
        <p>W, A, S, D = 移动 | 鼠标 = 视角/射击</p>
        <p>数字键 1-4 = 切换武器 (突击步枪, 冲锋枪, 狙击枪, 火箭筒)</p>
        <p>鼠标右键 = 狙击枪开镜 | R = 换弹</p>
        <p style="color: #55ff55; font-weight: bold; margin-top: 15px;">地图中央的绿色发光箱子是【无限子弹盒】，靠近即可补满备弹！</p>
        <button id="play-btn">点击开始游戏</button>
    </div>

    <div id="hud">
        <div id="damage-overlay"></div>
        <div id="sniper-overlay"></div>
        <div id="crosshair">
            <div class="ch-line ch-h"></div>
            <div class="ch-line ch-v"></div>
        </div>
        <div id="hit-marker">
            <div class="hm-line hm-h"></div>
            <div class="hm-line hm-v"></div>
        </div>
        <div id="stats">
            <div style="color: #ff5555; font-weight: bold;">HP: <span id="ui-hp">100</span></div>
            <div>武器: <span id="ui-weapon" style="color: #aaffaa;">突击步枪</span></div>
            <div>弹药: <span id="ui-ammo">30 / 120</span></div>
        </div>
        <div id="score-container">
            击杀: <span id="ui-score">0</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
