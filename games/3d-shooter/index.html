<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shooter Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
        }
        
        #sniper-scope {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, black 60%);
            display: none;
        }
        
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 2px #000;
        }
        
        #weapon-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            text-align: right;
            text-shadow: 2px 2px 2px #000;
        }

        #weapon-list {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .active-weapon {
            color: #fff;
            font-weight: bold;
            color: #ffd700;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        
        #start-btn {
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        #start-btn:hover {
            background-color: #45a049;
        }

        #hit-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            display: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #hit-marker::before, #hit-marker::after {
            content: '';
            position: absolute;
            background-color: red;
            width: 2px;
            height: 20px;
            top: 5px;
            left: 14px;
        }
        #hit-marker::before { transform: rotate(45deg); }
        #hit-marker::after { transform: rotate(-45deg); }
        
        #message {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 28px;
            text-shadow: 2px 2px 2px #000;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>3D 射击游戏</h1>
        <p>控制：WASD移动，鼠标瞄准/射击，数字键1-5切换武器</p>
        <p>1: 手枪 | 2: 突击步枪 | 3: 冲锋枪 | 4: 狙击枪 (右键开镜) | 5: 火箭发射器</p>
        <button id="start-btn">点击开始 (Click to Start)</button>
    </div>

    <div id="ui">
        <div id="sniper-scope"></div>
        <div id="crosshair"></div>
        <div id="hit-marker"></div>
        <div id="message"></div>
        <div id="hud">
            HP: <span id="health">100</span>
        </div>
        <div id="weapon-info">
            <div id="weapon-list"></div>
            <div id="current-weapon">手枪</div>
            <div id="ammo">15 / ∞</div>
        </div>
    </div>

    <!-- 导入 Three.js 及相关依赖 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
